<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Larkspur Commons - Book a tour</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-P8WTTHWN1X"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-P8WTTHWN1X');
</script>
<style>
  body{font-family:system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px;color:#2a2433}
  h1{color:#5b3f86} label{display:block;margin-top:14px} input,select{width:100%;padding:8px;margin-top:4px}
  button{margin-top:20px;padding:10px 18px;background:#5b3f86;color:#fff;border:0;border-radius:4px}
  #done{display:none;margin-top:20px;color:#1a7a3a}
</style>
</head>
<body>
<h1>Larkspur Commons</h1>
<p>Coworking desks and private offices in two neighborhoods. Book a tour and our community team will confirm a time within one business day.</p>
<form id="tour">
  <label>Your name <input name="name" required></label>
  <label>Location
    <select name="location">
      <option value="downtown">Downtown</option>
      <option value="eastside">Eastside</option>
    </select>
  </label>
  <label>Membership interest
    <select name="plan">
      <option value="hot_desk">Hot desk</option>
      <option value="dedicated_desk">Dedicated desk</option>
      <option value="private_office">Private office</option>
    </select>
  </label>
  <button type="submit">Request a tour</button>
</form>
<p id="done">Thanks, your tour request was received.</p>
<script>
  document.getElementById('tour').addEventListener('submit', function (e) {
    e.preventDefault();
    // Only location and plan go to GA; the name stays in the browser.
    gtag('event', 'tour_request_submit', { location: this.location.value, plan: this.plan.value });
    this.style.display = 'none';
    document.getElementById('done').style.display = 'block';
  });
</script>
</body>
</html>
